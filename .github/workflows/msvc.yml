name: Microsoft C++ Code Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '42 12 * * 2'
  workflow_dispatch:

env:
  # Path to the CMake build directory.
  build: '${{ github.workspace }}/build'

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Analyze
    runs-on: windows-latest

    steps:
      # SeriousProton lo exige el add_subdirectory del CMakeLists; fijado al
      # commit que incluye los arreglos de compilación estricta con MSVC (#294).
      - name: SeriousProton Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: daid/SeriousProton
          path: SeriousProton
          ref: e6f10ae5a3fcffc8f36ced0e7823cb3c57797acd

      - name: EmptyEpsilon Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: EmptyEpsilon

      # Misma provisión de SDL2 que el job Windows de cicd.yml: la configuración
      # de CMake necesita resolver SDL2::SDL2 aunque el análisis no enlace nada.
      - name: SDL2 Dependency
        run: |
          $sdl_version = "2.0.16"
          $sdl_link = "https://libsdl.org/release/SDL2-devel-$sdl_version-VC.zip"
          $sdl_zip = "$env:GITHUB_WORKSPACE/sdl-dev.zip"
          (new-object System.Net.WebClient).DownloadFile($sdl_link, $sdl_zip)
          Expand-Archive -LiteralPath $sdl_zip -DestinationPath "$env:GITHUB_WORKSPACE/externals"
          $sdl_config = @"
          set(flavor x86)
          if(CMAKE_SIZEOF_VOID_P EQUAL 8)
              set(flavor x64)
          endif()
          set(_SDL2_prefix "`${CMAKE_CURRENT_LIST_DIR}/SDL2-$sdl_version")

          add_library(SDL2::SDL2main STATIC IMPORTED)
          set_target_properties(SDL2::SDL2main PROPERTIES
          IMPORTED_LOCATION "`${_SDL2_prefix}/lib/`${flavor}/SDL2main.lib"
          )

          add_library(SDL2::SDL2 SHARED IMPORTED)
          set_target_properties(SDL2::SDL2 PROPERTIES
          IMPORTED_LOCATION "`${_SDL2_prefix}/lib/`${flavor}/SDL2.dll"
          IMPORTED_IMPLIB "`${_SDL2_prefix}/lib/`${flavor}/SDL2.lib"
          INTERFACE_INCLUDE_DIRECTORIES "`${_SDL2_prefix}/include"
          )

          target_link_libraries(SDL2::SDL2 INTERFACE SDL2::SDL2main)
          "@
          Set-Content -Path "$env:GITHUB_WORKSPACE/externals/sdl2-config.cmake" -Value $sdl_config

      # Sin -G fijo: windows-latest ya no trae VS 2022 y el generador
      # explícito "Visual Studio 17 2022" no encuentra ninguna instancia;
      # CMake elige el Visual Studio del runner. -A x64 y no Win32: el binding
      # Lua de SeriousProton exige sizeof(void*) == sizeof(ecs::Entity) (8
      # bytes) en static_assert de src/script/conversion.h, que en 32 bits no
      # se cumple. El sdl2-config provisto resuelve el sabor x64 solo.
      - name: Configure CMake
        run: >
          cmake -B ${{ env.build }} EmptyEpsilon
          -A x64
          -DSDL2_DIR:PATH="$env:GITHUB_WORKSPACE/externals"
          -DSERIOUS_PROTON_DIR="$env:GITHUB_WORKSPACE/SeriousProton"

      # El análisis compila con las rutas de include del proyecto, y
      # graphics/glDebug.inl es un fuente GENERADO por un custom command:
      # sin compilarlo antes, el include no existe. El consumidor del custom
      # command es seriousproton_objects (seriousproton es INTERFACE y no
      # produce proyecto MSBuild).
      - name: Build SeriousProton (genera glDebug.inl)
        run: cmake --build ${{ env.build }} --target seriousproton_objects

      - name: Initialize MSVC Code Analysis
        uses: microsoft/msvc-code-analysis-action@04825f6d9e00f87422d6bf04e1a38b1f3ed60d99
        # Provide a unique ID to access the sarif output path
        id: run-analysis
        with:
          cmakeBuildDirectory: ${{ env.build }}
          # Ruleset file that will determine what checks will be run
          ruleset: NativeRecommendedRules.ruleset

      # Upload SARIF file to GitHub Code Scanning Alerts
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          sarif_file: ${{ steps.run-analysis.outputs.sarif }}

      # Upload SARIF file as an Artifact to download and view
      # - name: Upload SARIF as an Artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: sarif-file
      #     path: ${{ steps.run-analysis.outputs.sarif }}
