name: Docker

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "bridge/**"
      - "foundry-module/**"
      - ".dockerignore"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "docker/**"
      - "bridge/**"
      - "foundry-module/**"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

jobs:
  bridge:
    name: Imagen del puente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests del puente
        run: |
          python -m pip install -r bridge/requirements-dev.txt
          pytest -q bridge
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests del módulo Foundry
        run: node --test foundry-module/tests/*.test.mjs
      - name: Build
        run: docker build -t espaciokooplagunak-bridge:ci bridge/
      - name: Smoke test /healthz
        run: |
          docker run -d --name bridge -p 8090:8090 \
            -e BRIDGE_TOKEN=ci -e EE_URL=http://127.0.0.1:9 \
            espaciokooplagunak-bridge:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8090/healthz > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          # El puente debe estar vivo aunque el juego no exista
          grep -q '"bridge":"ok"' /tmp/health.json
          # Y /v1/state debe rechazar peticiones sin token
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/v1/state)
          test "$code" = "401" || test "$code" = "403"
      - name: Logs on failure
        if: failure()
        run: docker logs bridge || true

  server:
    name: Imagen del servidor headless
    runs-on: ubuntu-latest
    # La compilación completa de C++ tarda; solo se ejecuta si cambia algo
    # que afecte a la imagen del servidor.
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f docker/Dockerfile -t espaciokooplagunak-server:ci .
      - name: Smoke test arranque headless
        run: |
          docker run -d --name game espaciokooplagunak-server:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' game)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 5
          done
          docker logs game
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker logs game || true
