# Tests de las herramientas de Python (tools/): asistente de instalación,
# empaquetador del módulo de Foundry y auditor de cabeceras i18n. Job ligero
# y separado de los builds C++: solo Python y polib (el único import de
# terceros de estos tests; el resto de requirements-i18n son pesados y no
# hacen falta aquí). Límite declarado: cubre Linux — la ruta nativa de
# Windows del instalador no se ejercita en CI.
name: Tools

on:
  push:
    branches: [main]
  # El filtro se mudó del disparador a un job (#361): con `paths:` aquí, este
  # check no existía en los PRs de otras áreas y por eso no se podía exigir.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Filtro de rutas (tools)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filtro.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - id: filtro
        uses: ./.github/actions/filtro-rutas
        with:
          # La trazabilidad de nombres DP depende del escenario y del documento
          # tanto como de la propia herramienta (#310).
          #
          # `src/` y `resources/locale/` entran por la cobertura de i18n del C++
          # (#55): una cadena nueva en una pantalla y su entrada de catálogo son
          # las dos mitades de la misma costura, así que tocar cualquiera de las
          # dos tiene que despertar esta auditoría. Sigue siendo un job de Python
          # de segundos; no arrastra la build.
          #
          # `docs/` y cualquier `.md` entran por el comprobador de rutas
          # citadas: una referencia rota la introduce un documento, no una
          # herramienta, así que con el filtro anterior este check no se
          # despertaba nunca en el PR que la rompe.
          #
          # `scripts/` entra por las DOS auditorías de i18n de escenario, y su
          # ausencia es como se rompió `main` el 26-ago-2026: el filtro tenía
          # `resources/locale/` (los catálogos del C++) pero NO
          # `scripts/locale/` (los de escenario), así que un PR que solo tocaba
          # catálogos de escenario —que es justo lo que son los lotes de
          # traducción— no despertaba nunca esta puerta. Los lotes A, B y C
          # entraron con el job SALTADO, y la rotura solo se hizo visible días
          # después, en un PR de `tools/` que sí lo despertaba.
          #
          # Va `scripts/` entero y no `scripts/locale/`: la clave esperada la
          # declara el `.lua` del escenario, así que tocar el escenario puede
          # dejar su catálogo obsoleto igual que tocar el catálogo.
          rutas: '^(tools/|\.github/workflows/tools\.yml$|\.github/labeler\.yml$|\.github/actions/|scripts/|docs/DOMINIO_PUBLICO_SCIFI\.md$|src/|resources/locale/|docs/|.*\.md$)'

  tests:
    name: tools/tests (Linux)
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # La guarda de catálogos compara con la rama base, así que necesita
          # historia. Con el clon superficial por defecto `origin/main` no
          # existe y la guarda sale por 2 en vez de comprobar nada.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Instalar dependencias de test
        # pyyaml lo usa la guardia de las puertas de CI (#361).
        run: python3 -m pip install pytest polib==1.2.0 pyyaml==6.0.2
      - name: Ejecutar tests de tools/ (Python)
        run: python3 -m pytest tools/tests/ -q
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Instalar draco3d para normalizar-glb.mjs
        # normalizar-glb.mjs decodifica mallas comprimidas con draco3d (WASM).
        # tools/ no es un proyecto npm (ver .gitignore: package.json y
        # package-lock.json están excluidos a propósito, igual que en
        # foundry-module/) así que se instala sin manifiesto ni lockfile en
        # vez de añadir uno solo para esta única dependencia; sin este paso
        # el `node --test` de abajo falla con ERR_MODULE_NOT_FOUND.
        working-directory: tools
        run: npm install draco3d@1.5.7 --no-save
      - name: Ejecutar tests de tools/ (Node)
        # tools/ nombra sus tests Node con prefijo `test_*.mjs`, no con el
        # sufijo `*.test.mjs` del modulo Foundry; por eso el glob del modulo no
        # los encontraba y la suite salia vacia (lo marco el review de #841).
        # Un glob vacio ENROJECE la puerta en vez de omitirla: una suite que no
        # se encuentra es indistinguible de una suite que no existe, y ese es
        # justo el falso verde que este PR viene a cerrar.
        shell: bash
        run: |
          shopt -s nullglob
          files=(tools/tests/test_*.mjs)
          if [ ${#files[@]} -gt 0 ]; then
            node --test "${files[@]}"
          else
            echo "::error::No se encontro ningun tools/tests/test_*.mjs."
            exit 1
          fi
      - name: Trazabilidad de nombres de dominio público (#310)
        run: python3 tools/check_public_domain_names.py
      - name: Cobertura i18n de las cadenas de C++ (#55)
        # `validate_es_locale.py` compara en-US contra es-ES, así que no ve una
        # cadena que no llegó a NINGUNO de los dos catálogos. Esto mira la otra
        # costura: del código al catálogo.
        run: python3 tools/check_cpp_locale_coverage.py .
      - name: Paridad e invariantes del catálogo es-ES
        # Con `--base` cada error sale marcado NUEVO o HEREDADO. El código de
        # salida no cambia —un catálogo roto es un fallo lo rompiera quien lo
        # rompiera— pero sin esa marca un rojo heredado y uno propio son
        # indistinguibles, y entonces el rojo deja de significar nada: es como
        # #789 y #793 se fusionaron con esta puerta ROJA y luego #794, #796 y
        # #797 arrastraron un rojo que no era suyo.
        #
        # Solo en PRs: en un push a `main` la base sería `main`, o sea el propio
        # commit, y todo saldría HEREDADO — justo la tranquilidad falsa que esto
        # viene a quitar. Sin `--base` la auditoría es la de siempre.
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            python3 tools/validate_es_locale.py . --base "origin/${{ github.base_ref }}"
          else
            python3 tools/validate_es_locale.py .
          fi
      - name: Ningún catálogo .po pierde claves
        # `check_scenario_header_locale.py` solo mira las claves de CABECERA, así
        # que su criterio se puede cumplir borrando las otras cientos. Pasó tres
        # veces el 26-ago-2026 (un catálogo de 660 claves quedó en 66) y el diff
        # de un `.po` reescrito no lo delata: parece reflujo de líneas largas.
        run: python3 tools/check_po_no_pierde_claves.py --base origin/${{ github.base_ref || 'main' }}
      - name: Rutas citadas por la documentación
        # Solo stdlib. Recorre los .md y comprueba que cada ruta que citan
        # existe: una cita rota manda al lector —o al agente— a perseguir
        # fantasmas, y hasta ahora nadie ejecutaba esta herramienta.
        run: python3 tools/refs-rotas.py

  puerta:
    name: Puerta de tools
    if: always()
    needs: [changes, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: ./.github/actions/puerta
        with:
          resultados: ${{ toJSON(needs) }}
