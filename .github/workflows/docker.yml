name: Docker

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "bridge/**"
      - ".dockerignore"
      - "src/**"
      - "CMakeLists.txt"
      - "scripts/scenario_90_lagunak_primera_guardia.lua"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "docker/**"
      - "bridge/**"
      - ".dockerignore"
      - "src/**"
      - "CMakeLists.txt"
      - "scripts/scenario_90_lagunak_primera_guardia.lua"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Invariante de SECURITY.md como gate: el puerto HTTP del juego (8080,
  # /exec.lua, Lua arbitrario sin autenticación) no se publica JAMÁS fuera de
  # la red interna de compose. Hasta ahora solo lo protegía la revisión humana.
  guardia-exec-lua:
    name: El puerto de /exec.lua no se publica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Comprobar exposición de /exec.lua en compose.yaml
        run: |
          set -euo pipefail

          expone_exec_lua() {
            jq -e '
              (.services.game.network_mode // "") == "host"
              or any(.services[]; any(.ports[]?; .target == 8080))
            ' "$1" >/dev/null
          }

          config=$(mktemp)
          BRIDGE_TOKEN=ci docker compose -f docker/compose.yaml config --format json > "$config"

          if expone_exec_lua "$config"; then
            echo "::error::docker/compose.yaml expone /exec.lua mediante el puerto 8080 o network_mode: host. Ver SECURITY.md."
            exit 1
          fi

          # Regresiones hostiles: el gate debe detectar ambas vías aunque el
          # compose real permanezca seguro.
          hostil_host=$(mktemp)
          jq '.services.game.network_mode = "host" | .services.game |= del(.ports)' \
            "$config" > "$hostil_host"
          expone_exec_lua "$hostil_host" \
            || { echo "::error::La guardia no detecta network_mode: host."; exit 1; }

          hostil_puerto=$(mktemp)
          jq '.services.game.ports = [{"target": 8080, "published": "8080", "protocol": "tcp"}]' \
            "$config" > "$hostil_puerto"
          expone_exec_lua "$hostil_puerto" \
            || { echo "::error::La guardia no detecta la publicación del puerto 8080."; exit 1; }

  # Suite pytest del puente (simula /exec.lua; no necesita el juego): auth,
  # límite de frecuencia, lista blanca de órdenes, eventos y contactos. Se
  # instala lua5.3 (el mismo intérprete del job LuaTest) porque parte de la
  # suite ejecuta el Lua fijo del puente con un intérprete real; los tests
  # que lo requieren se saltan limpiamente si faltara.
  pytest:
    name: Tests del puente (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Instalar Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Instalar dependencias
        run: python3 -m pip install -r bridge/requirements-dev.txt
      - name: Ejecutar pytest
        working-directory: bridge
        run: python3 -m pytest

  bridge:
    name: Imagen del puente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build
        run: docker build -t espaciokooplagunak-bridge:ci bridge/
      - name: Smoke test /healthz
        run: |
          docker run -d --name bridge -p 8090:8090 \
            -e BRIDGE_TOKEN=ci -e EE_URL=http://127.0.0.1:9 \
            espaciokooplagunak-bridge:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8090/healthz > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          # El puente debe estar vivo aunque el juego no exista
          grep -q '"bridge":"ok"' /tmp/health.json
          # Y /v1/state debe rechazar peticiones sin token
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/v1/state)
          test "$code" = "401" || test "$code" = "403"
      - name: Logs on failure
        if: failure()
        run: docker logs bridge || true

  server:
    name: Imagen del servidor headless
    runs-on: ubuntu-latest
    # La compilación completa de C++ tarda; solo se ejecuta si cambia algo
    # que afecte a la imagen del servidor.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build
        run: docker build -f docker/Dockerfile -t espaciokooplagunak-server:ci .
      - name: Smoke test arranque headless (escenario propio del fork)
        run: |
          docker run -d --name game \
            -e EE_SCENARIO=scenario_90_lagunak_primera_guardia.lua \
            espaciokooplagunak-server:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' game)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 5
          done
          docker logs game
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker logs game || true
