name: Foundry module

on:
  push:
    branches: [main]
  # Sin `paths:` a propósito (#361). Con el filtro en el disparador, un PR que no
  # toca el módulo no producía NINGÚN check run, y un check requerido que no
  # existe deja el PR esperando para siempre. El filtro vive ahora dentro, donde
  # saltar un job lo deja `skipped` —reportado— en vez de inexistente.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Filtro de rutas (módulo)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filtro.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - id: filtro
        uses: ./.github/actions/filtro-rutas
        with:
          rutas: '^(foundry-module/|\.github/workflows/foundry-module\.yml$|\.github/actions/)'

  tests:
    name: Tests del módulo Foundry (Node)
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Comprobar sintaxis JavaScript
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(foundry-module/scripts/**/*.mjs foundry-module/tests/**/*.mjs)
          ((${#files[@]} > 0))
          for file in "${files[@]}"; do
            node --check "$file"
          done
      - name: Ejecutar tests del módulo
        run: node --test foundry-module/tests/*.test.mjs
      - name: Verificar inventario conservador de módulos
        run: python3 scripts/check_orphan_modules.py --check
      - name: El PNG prerenderizado corresponde al generador
        run: node tools/prerender-piel.mjs --check

  puerta:
    name: Puerta del módulo Foundry
    # `always()` para que la puerta exista incluso cuando todo lo que vigila se
    # ha saltado: ese es justo el caso que tiene que reportar verde.
    if: always()
    needs: [changes, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: ./.github/actions/puerta
        with:
          resultados: ${{ toJSON(needs) }}
