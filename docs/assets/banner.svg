<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Espaciokoop Lagunak</title>
  <desc id="desc">Simulador cooperativo de puente espacial basado en EmptyEpsilon, conectado de forma segura con Foundry VTT, con puestos de tripulación, mapa vivo, estado de nave y minijuegos sociales.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="1" stop-color="#061726"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082339"/>
      <stop offset="1" stop-color="#03111f"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#32b9d8"/><stop offset="1" stop-color="#78f3ff"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a76025"/><stop offset="1" stop-color="#ffbe63"/>
    </linearGradient>
    <radialGradient id="planet" cx="35%" cy="30%">
      <stop offset="0" stop-color="#9ef6ff"/><stop offset=".25" stop-color="#2d87a8"/><stop offset="1" stop-color="#062b47"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="viewport"><path d="M236 77h428l44 132H192z"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,monospace}
      .label{font:700 9px ui-monospace,"JetBrains Mono",monospace;letter-spacing:1.2px}
      .tiny{font:8px ui-monospace,"JetBrains Mono",monospace;letter-spacing:.6px}
      .line{fill:none;stroke:#226482;stroke-width:1}
    </style>
  </defs>

  <rect width="900" height="280" rx="14" fill="url(#space)"/>
  <rect x="1" y="1" width="898" height="278" rx="13" fill="none" stroke="#16425d" stroke-width="2"/>

  <!-- estrellas -->
  <g fill="#c8f7ff">
    <circle cx="28" cy="38" r="1" opacity=".7"/><circle cx="76" cy="20" r="1.2" opacity=".45"/><circle cx="145" cy="51" r=".8" opacity=".8"/>
    <circle cx="751" cy="28" r="1" opacity=".7"/><circle cx="840" cy="54" r="1.2" opacity=".45"/><circle cx="872" cy="18" r=".8" opacity=".8"/>
    <circle cx="690" cy="58" r=".7" opacity=".6"/><circle cx="211" cy="20" r=".8" opacity=".6"/>
  </g>

  <!-- cabecera -->
  <text x="450" y="34" class="mono" text-anchor="middle" font-size="26" font-weight="900" letter-spacing="7" fill="#e9fbff" filter="url(#glow)">ESPACIOKOOP LAGUNAK</text>
  <text x="450" y="55" class="mono" text-anchor="middle" font-size="9.5" letter-spacing="2.4" fill="#63cce7">TRIPULACIÓN COOPERATIVA · SIMULACIÓN ESPACIAL · FOUNDRY VTT</text>

  <!-- panel izquierdo: puestos -->
  <g>
    <path d="M24 75h158l27 136H24z" fill="url(#panel)" stroke="#17506d" stroke-width="1.5"/>
    <text x="43" y="96" class="label" fill="#78f3ff">PUESTOS CONECTADOS</text>
    <g class="mono" font-size="9.5">
      <circle cx="43" cy="117" r="3" fill="#43df8b"/><text x="54" y="120" fill="#d9f7ff">MANDO</text><text x="171" y="120" text-anchor="end" fill="#43df8b">LISTO</text>
      <circle cx="43" cy="140" r="3" fill="#43df8b"/><text x="54" y="143" fill="#d9f7ff">NAVEGACIÓN</text><text x="171" y="143" text-anchor="end" fill="#43df8b">127°</text>
      <circle cx="43" cy="163" r="3" fill="#ffbe63"/><text x="54" y="166" fill="#d9f7ff">INGENIERÍA</text><text x="171" y="166" text-anchor="end" fill="#ffbe63">67%</text>
      <circle cx="43" cy="186" r="3" fill="#43df8b"/><text x="54" y="189" fill="#d9f7ff">ARMAS</text><text x="171" y="189" text-anchor="end" fill="#43df8b">SEGURO</text>
    </g>
    <path d="M38 201h135" stroke="#16425d"/>
    <text x="43" y="218" class="tiny" fill="#548ba4">IDENTIDAD · PERMISOS · ÓRDENES</text>
  </g>

  <!-- mirador del puente -->
  <path d="M236 77h428l44 132H192z" fill="#010611" stroke="#2b7897" stroke-width="2"/>
  <g clip-path="url(#viewport)">
    <rect x="190" y="76" width="520" height="135" fill="#010611"/>
    <g fill="#d5faff">
      <circle cx="244" cy="101" r="1"/><circle cx="314" cy="87" r=".7"/><circle cx="386" cy="118" r="1.1"/><circle cx="478" cy="92" r=".8"/>
      <circle cx="588" cy="106" r="1"/><circle cx="652" cy="88" r=".8"/><circle cx="671" cy="156" r="1"/><circle cx="259" cy="174" r=".8"/>
    </g>
    <circle cx="601" cy="142" r="47" fill="url(#planet)"/>
    <ellipse cx="601" cy="147" rx="60" ry="17" fill="none" stroke="#5fc4e8" stroke-width="2" opacity=".45" transform="rotate(-12 601 147)"/>
    <!-- nave -->
    <g transform="translate(423 145)" filter="url(#glow)">
      <path d="M-54 10L-17-5L0-28L17-5L54 10L18 18L0 13L-18 18z" fill="#0a334b" stroke="#78f3ff" stroke-width="2"/>
      <path d="M-17-5L0 13L17-5L0-28z" fill="#16637e"/><path d="M-44 11l-18 6 22 3zM44 11l18 6-22 3z" fill="#ffbe63" opacity=".8"/>
      <circle cx="0" cy="-4" r="3" fill="#e9fbff"/>
    </g>
    <!-- ruta viva -->
    <path d="M421 167C470 189 526 184 567 157" fill="none" stroke="#ffbe63" stroke-width="1.5" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.5s" repeatCount="indefinite"/></path>
    <circle cx="567" cy="157" r="4" fill="#ffbe63"><animate attributeName="r" values="3;6;3" dur="1.7s" repeatCount="indefinite"/></circle>
    <text x="451" y="198" class="tiny" fill="#63cce7">MAPA VIVO · RUMBO 127.4° · ETA 00:42</text>
  </g>

  <!-- montantes del puente -->
  <path d="M236 77l-44 132M664 77l44 132M450 77v132" fill="none" stroke="#123b53" stroke-width="2" opacity=".8"/>

  <!-- panel derecho: estado + capa social -->
  <g>
    <path d="M718 75h158v136H691z" fill="url(#panel)" stroke="#17506d" stroke-width="1.5"/>
    <text x="724" y="96" class="label" fill="#78f3ff">ESTADO DE NAVE</text>
    <text x="724" y="116" class="tiny" fill="#d9f7ff">CASCO</text><rect x="765" y="109" width="92" height="7" rx="2" fill="#0b2a3b"/><rect x="765" y="109" width="76" height="7" rx="2" fill="url(#cyan)"/><text x="861" y="116" class="tiny" fill="#78f3ff">82</text>
    <text x="724" y="136" class="tiny" fill="#d9f7ff">ENERGÍA</text><rect x="765" y="129" width="92" height="7" rx="2" fill="#0b2a3b"/><rect x="765" y="129" width="62" height="7" rx="2" fill="url(#amber)"/><text x="861" y="136" class="tiny" fill="#ffbe63">67</text>
    <text x="724" y="156" class="tiny" fill="#d9f7ff">ALERTA</text><rect x="765" y="149" width="92" height="7" rx="2" fill="#0b2a3b"/><rect x="765" y="149" width="31" height="7" rx="2" fill="#43df8b"/><text x="861" y="156" class="tiny" fill="#43df8b">BAJA</text>
    <path d="M719 169h140" stroke="#16425d"/>
    <!-- tres cartas pixel-art -->
    <g transform="translate(729 180)">
      <rect width="28" height="38" rx="3" fill="#edf7f7" stroke="#63cce7"/><text x="5" y="13" class="mono" font-size="10" font-weight="700" fill="#d34f64">A</text><path d="M14 19l5 6-5 7-5-7z" fill="#d34f64"/>
      <rect x="34" width="28" height="38" rx="3" fill="#edf7f7" stroke="#63cce7"/><text x="39" y="13" class="mono" font-size="10" font-weight="700" fill="#182e47">K</text><path d="M48 20l5 5-5 5-5-5z" fill="#182e47"/>
      <rect x="68" width="28" height="38" rx="3" fill="#edf7f7" stroke="#63cce7"/><text x="73" y="13" class="mono" font-size="10" font-weight="700" fill="#d34f64">Q</text><path d="M82 19c9 5 4 12 0 14-4-2-9-9 0-14z" fill="#d34f64"/>
    </g>
    <text x="833" y="194" class="tiny" fill="#ffbe63">CANTINA</text><text x="833" y="208" class="tiny" fill="#548ba4">MINIJUEGOS</text>
  </g>

  <!-- bus de integración -->
  <g transform="translate(70 239)">
    <rect x="0" y="0" width="760" height="27" rx="6" fill="#04111d" stroke="#16425d"/>
    <text x="65" y="18" class="label" text-anchor="middle" fill="#bba7f4">FOUNDRY VTT</text>
    <path d="M132 13h92" stroke="#5c86a0" stroke-dasharray="4 3"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="1.3s" repeatCount="indefinite"/></path>
    <text x="290" y="18" class="label" text-anchor="middle" fill="#ffbe63">PUENTE SEGURO · API v0</text>
    <path d="M365 13h92" stroke="#5c86a0" stroke-dasharray="4 3"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="1.3s" repeatCount="indefinite"/></path>
    <text x="529" y="18" class="label" text-anchor="middle" fill="#78f3ff">EMPTYEPSILON</text>
    <text x="698" y="18" class="tiny" text-anchor="middle" fill="#548ba4">FORK · GPL-2.0</text>
  </g>

  <text x="18" y="273" class="tiny" fill="#386d86">C++17 · DOCKER · FOUNDRY · COOPERACIÓN POR PUESTOS</text>
  <text x="882" y="273" class="tiny" text-anchor="end" fill="#386d86">LAGUNAK ARTEAN</text>
</svg>
