<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Espaciokoop Lagunak — simulador de puente de mando cooperativo, fork de EmptyEpsilon con integración Foundry VTT y Docker">
<defs>
<style>
@keyframes shimmer{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes softblink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 3px #3ddcff)}50%{filter:drop-shadow(0 0 10px #3ddcff)}}
@keyframes ants{to{stroke-dashoffset:-16}}
@keyframes pktdown{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(22px);opacity:0}}
@keyframes pktup{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
@keyframes typecmd{0%,8%{transform:translateX(0)}72%{transform:translateX(500px)}100%{transform:translateX(500px)}}
@keyframes hullpulse{0%,100%{opacity:.85}50%{opacity:1}}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.title{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800;fill:#e8f9ff}
.tag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#5fc4e8;letter-spacing:2px}
.st{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#d9f4ff}
.dim{fill:#2e6f92}
.amber{fill:#ffb35c}
.cyan{fill:#3ddcff}
.cmd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#c7eeff}
.star{fill:#bfefff;animation:shimmer ease-in-out infinite}
.box{fill:#051a2c;stroke-width:1.2}
.boxlabel{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;letter-spacing:1.5px}
.ants{stroke:#1a7fa8;stroke-width:1.2;stroke-dasharray:4 4;animation:ants 1.2s linear infinite}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#04101f"/><stop offset="100%" stop-color="#010409"/>
</linearGradient>
<linearGradient id="wedge" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#3ddcff" stop-opacity="0"/><stop offset="100%" stop-color="#3ddcff" stop-opacity=".5"/>
</linearGradient>
<linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#1a7fa8"/><stop offset="100%" stop-color="#3ddcff"/>
</linearGradient>
<linearGradient id="energy" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#b3702e"/><stop offset="100%" stop-color="#ffb35c"/>
</linearGradient>
</defs>

<rect width="900" height="240" fill="url(#bg)"/>

<!-- estrellas en los márgenes -->
<circle class="star" cx="18" cy="52" r="1.4" style="animation-duration:2.4s"/>
<circle class="star" cx="34" cy="120" r="1" style="animation-duration:3.1s;animation-delay:-1.2s"/>
<circle class="star" cx="14" cy="186" r="1.2" style="animation-duration:2.8s;animation-delay:-.6s"/>
<circle class="star" cx="40" cy="222" r="1" style="animation-duration:3.6s;animation-delay:-2s"/>
<circle class="star" cx="864" cy="60" r="1.3" style="animation-duration:2.6s;animation-delay:-.9s"/>
<circle class="star" cx="884" cy="132" r="1" style="animation-duration:3.3s;animation-delay:-1.7s"/>
<circle class="star" cx="870" cy="198" r="1.4" style="animation-duration:2.2s;animation-delay:-.3s"/>
<circle class="star" cx="120" cy="16" r="1" style="animation-duration:3s;animation-delay:-1.1s"/>
<circle class="star" cx="360" cy="10" r="1.1" style="animation-duration:2.7s;animation-delay:-2.2s"/>
<circle class="star" cx="700" cy="14" r="1" style="animation-duration:3.4s;animation-delay:-.8s"/>
<circle class="star" cx="812" cy="24" r="1.2" style="animation-duration:2.5s;animation-delay:-1.5s"/>

<!-- título -->
<text class="title" x="450" y="24" text-anchor="middle" style="animation:glow 3.2s ease-in-out infinite;font-size:19px;letter-spacing:7px">E S P A C I O K O O P&#160;&#160;L A G U N A K</text>

<!-- ventana terminal -->
<rect x="48" y="34" width="804" height="180" rx="10" fill="#03101e" stroke="#0e3a5c" stroke-width="1.5"/>
<path d="M48 44 a10 10 0 0 1 10-10 h784 a10 10 0 0 1 10 10 v16 h-804 z" fill="#061c30"/>
<circle cx="68" cy="47" r="5" fill="#ff5f57"/><circle cx="86" cy="47" r="5" fill="#febc2e"/><circle cx="104" cy="47" r="5" fill="#28c840"/>
<text x="450" y="51" text-anchor="middle" class="tag" style="font-size:10px;letter-spacing:1px">espaciokoop-lagunak — puente de mando &#183; headless &#183; foundry vtt</text>

<!-- radar de sensores -->
<g stroke="#12496b" fill="none" stroke-width="1">
<circle cx="160" cy="130" r="18"/><circle cx="160" cy="130" r="36"/><circle cx="160" cy="130" r="52"/>
<line x1="108" y1="130" x2="212" y2="130"/><line x1="160" y1="78" x2="160" y2="182"/>
</g>
<g>
<path d="M160 130 L160 78 A52 52 0 0 1 194.8 91.4 Z" fill="url(#wedge)" opacity=".45"/>
<line x1="160" y1="130" x2="160" y2="78" stroke="#3ddcff" stroke-width="1.6" style="animation:glow 2s ease-in-out infinite"/>
<animateTransform attributeName="transform" type="rotate" from="0 160 130" to="360 160 130" dur="5s" repeatCount="indefinite"/>
</g>
<circle cx="135" cy="105" r="2.6" fill="#ff5f57" style="animation:blink 1.4s step-end infinite"/>
<circle cx="185" cy="150" r="2.6" fill="#3ddcff" style="animation:blink 2.2s step-end infinite"/>
<circle cx="178" cy="110" r="2.2" fill="#ffb35c" style="animation:blink 3s step-end infinite"/>
<circle cx="160" cy="130" r="2" fill="#e8f9ff"/>
<text x="160" y="196" text-anchor="middle" class="tag" style="font-size:9px">sensores &#183; largo alcance</text>

<!-- diagrama de integración -->
<rect class="box" x="292" y="78" width="150" height="24" rx="4" stroke="#5f4a9e"/>
<text x="367" y="94" text-anchor="middle" class="boxlabel" fill="#b9a6f2">FOUNDRY VTT</text>
<line class="ants" x1="360" y1="102" x2="360" y2="124"/>
<line class="ants" x1="374" y1="124" x2="374" y2="102" style="animation-direction:reverse"/>
<rect x="357" y="104" width="6" height="6" fill="#b9a6f2" style="animation:pktdown 1.8s linear infinite"/>
<rect x="371" y="116" width="6" height="6" fill="#ffb35c" style="animation:pktup 1.8s linear infinite;animation-delay:-.9s"/>
<rect class="box" x="292" y="124" width="150" height="24" rx="4" stroke="#b3702e"/>
<text x="367" y="140" text-anchor="middle" class="boxlabel amber">PUENTE &#183; API v0</text>
<line class="ants" x1="360" y1="148" x2="360" y2="170"/>
<line class="ants" x1="374" y1="170" x2="374" y2="148" style="animation-direction:reverse"/>
<rect x="357" y="150" width="6" height="6" fill="#ffb35c" style="animation:pktdown 1.8s linear infinite;animation-delay:-.5s"/>
<rect x="371" y="162" width="6" height="6" fill="#3ddcff" style="animation:pktup 1.8s linear infinite;animation-delay:-1.4s"/>
<rect class="box" x="292" y="170" width="150" height="24" rx="4" stroke="#1a7fa8"/>
<text x="367" y="186" text-anchor="middle" class="boxlabel cyan">SIMULACI&#211;N</text>
<text x="452" y="94" class="mono dim" style="font-size:9px">eventos</text>
<text x="452" y="140" class="mono dim" style="font-size:9px">&#243;rdenes</text>
<text x="452" y="186" class="mono dim" style="font-size:9px">autoritativa</text>

<!-- panel de estado de nave -->
<text x="520" y="92" class="st amber" style="font-weight:700;letter-spacing:1px">EKL&#183;ATLANTIS</text>
<text x="655" y="92" class="st dim">RUMBO 127.4&#176; &#183; ETA 00:42</text>
<text x="520" y="112" class="st">CASCO</text>
<rect x="590" y="104" width="180" height="8" rx="2" fill="#0a2438"/>
<rect x="590" y="104" width="148" height="8" rx="2" fill="url(#hull)" style="animation:hullpulse 2.4s ease-in-out infinite"/>
<text x="778" y="112" class="st cyan">82%</text>
<text x="520" y="132" class="st">ENERG&#205;A</text>
<rect x="590" y="124" width="180" height="8" rx="2" fill="#0a2438"/>
<rect x="590" y="124" width="121" height="8" rx="2" fill="url(#energy)" style="animation:hullpulse 3.1s ease-in-out infinite"/>
<text x="778" y="132" class="st amber">67%</text>
<text x="520" y="152" class="st">ESCUDOS <tspan class="cyan" style="animation:softblink 1.8s ease-in-out infinite">[ACTIVOS]</tspan>&#160;&#160;WARP 0 &#183; IMPULSO 0.75</text>
<text x="520" y="170" class="mono dim" style="font-size:10px">reactor OK &#183; motores OK &#183; sensores OK &#183; armas OK</text>
<text x="520" y="186" class="mono dim" style="font-size:10px">tripulaci&#243;n: 5 puestos conectados</text>

<!-- línea de comandos -->
<g>
<text x="66" y="207" class="cmd"><tspan fill="#28c840">$</tspan> docker compose up -d &#183; <tspan fill="#28c840">&#10003;</tspan> game &#183; <tspan fill="#28c840">&#10003;</tspan> bridge &#183; GET /v1/state <tspan class="cyan">200 OK</tspan></text>
<g style="animation:typecmd 8s steps(52) infinite">
<rect x="78" y="196" width="520" height="15" fill="#03101e"/>
<rect x="78" y="196" width="8" height="13" fill="#3ddcff" style="animation:blink .9s step-end infinite"/>
</g>
</g>

<text x="450" y="232" text-anchor="middle" class="tag">C++17 &#183; FORK DE EMPTYEPSILON &#183; PUENTE FOUNDRY VTT &#183; DOCKER &#183; KOOP LAGUNAK ARTEAN</text>
</svg>
