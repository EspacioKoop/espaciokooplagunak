# Dependabot acotado a lo PROPIO del fork (issue #88, ver docs/BASELINE.md):
# actions de CI, dependencias Python del puente e imágenes base de Docker.
# Deliberadamente NO vigila dependencias C++ heredadas de upstream
# (CMakeLists.txt, src/): un bump ahí es divergencia upstream permanente y
# le corresponde a EmptyEpsilon resolverlo a su ritmo (docs/UPSTREAM.md).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "pip"
    directory: "/bridge"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # Y las de tools/, que se quedaron fuera cuando se escribió esto: el puente no
  # es el único Python del árbol. `tools/requirements-i18n.txt` lo usan las
  # herramientas de traducción, que corren en CI igual que el resto.
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directories:
      - "/docker"
      - "/bridge"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
