name: Publicar imágenes Docker

# Publica en GHCR las dos imágenes del despliegue (docker/README.md):
#   ghcr.io/<owner>/espaciokooplagunak-server  — servidor headless (build
#     reproducible contra el SERIOUS_PROTON_REF fijado en docker/Dockerfile)
#   ghcr.io/<owner>/espaciokooplagunak-bridge  — puente Foundry VTT
#
# Solo con tag v* o lanzamiento manual: la imagen del servidor compila todo el
# juego, y publicar por commit sería caro y sin semántica de versión. Nunca se
# etiqueta `latest` (convención de docker/README.md: despliegues estables
# siempre con versión explícita).

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/docker-publish.yml"
      - "bridge/Dockerfile"
      - "bridge/requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    name: Validar publicación Docker sin push
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/espaciokooplagunak-bridge
          flavor: |
            latest=false
          tags: |
            type=sha
      - name: Comprobar tags del dry-run
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          case "$TAGS" in
            *:sha-*) ;;
            *) echo "::error::metadata-action no generó un tag SHA."; exit 1 ;;
          esac
          case "$TAGS" in
            *:latest*) echo "::error::metadata-action generó latest."; exit 1 ;;
          esac
      # El dry-run de arriba solo ejerce `type=sha`, así que durante 23 ejecuciones
      # verdes no miró nunca la configuración con la que se publica de verdad. Este
      # paso sí: comprueba que el job de publicación sabe etiquetar la versión POR
      # FECHA de este repositorio. `type=semver` no puede —`2026.08.27` no es semver
      # por el cero del mes— y solo emite un warning, así que se publicaría sin tag
      # de versión con el job en verde.
      # La guarda anterior extraía `pattern` y lo probaba con grep, ignorando
      # `group`. Un `group=99` —que no existe, así que no puede producir tag de
      # versión— la pasaba en verde, porque `v2026.08.27` casa con `v(.*)`
      # igual. Es la misma clase de falso verde que este PR viene a impedir.
      #
      # Ahora se EJECUTA `metadata-action` con la configuración real del job de
      # publicación y un tag de ejemplo, y se mira el tag que sale. `context:
      # git` hace que la action lea el tag del repositorio local en vez del ref
      # del evento, que en un PR nunca es un tag.
      - name: Preparar un tag de ejemplo del esquema del repositorio
        run: git tag -f v2026.08.27
      - id: meta-publicacion
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ghcr.io/${{ github.repository_owner }}/espaciokooplagunak-server
          flavor: |
            latest=false
          tags: |
            type=match,pattern=v(.*),group=1
            type=sha
      # Control NEGATIVO: la MISMA configuración con un grupo inexistente. Si
      # esto produjera un tag de versión, la comprobación de arriba no
      # demostraría nada.
      - id: meta-grupo-malo
        continue-on-error: true
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ghcr.io/${{ github.repository_owner }}/espaciokooplagunak-server
          flavor: |
            latest=false
          tags: |
            type=match,pattern=v(.*),group=99
      - name: El job de publicación etiqueta la versión por fecha
        env:
          TAGS: ${{ steps.meta-publicacion.outputs.tags }}
          TAGS_GRUPO_MALO: ${{ steps.meta-grupo-malo.outputs.tags }}
        run: |
          set -euo pipefail

          # 1) La configuración probada tiene que ser LA MISMA que publica. Dos
          #    copias que se puedan separar convierten esta guarda en decorado.
          conf() {
            sed -n "/^  $1:/,/^  [a-z-]*:$/p" .github/workflows/docker-publish.yml \
              | grep -v '^[[:space:]]*#' | sed -n 's/.*\(type=match,pattern=[^ ]*\).*/\1/p' | head -1 || true
          }
          CONF_PUBLICA="$(conf publish)"
          CONF_PROBADA="$(printf '%s' "$(sed -n '/id: meta-publicacion/,/id: meta-grupo-malo/p' \
            .github/workflows/docker-publish.yml)" \
            | sed -n 's/.*\(type=match,pattern=[^ ]*\).*/\1/p' | head -1 || true)"
          if [ -z "$CONF_PUBLICA" ]; then
            echo "::error::El job de publicación no declara ningún type=match del que derivar el tag de versión."
            exit 1
          fi
          if [ "$CONF_PUBLICA" != "$CONF_PROBADA" ]; then
            echo "::error::La guarda prueba '${CONF_PROBADA}' pero se publica con '${CONF_PUBLICA}'."
            exit 1
          fi

          # 2) `type=semver` no vale para una versión por fecha: `2026.08.27`
          #    lleva cero a la izquierda en el mes y semver lo prohíbe, y la
          #    action solo avisa con un warning.
          if sed -n '/^  publish:/,$p' .github/workflows/docker-publish.yml \
             | grep -v '^[[:space:]]*#' | grep -q 'type=semver'; then
            echo "::error::El job de publicación usa type=semver, que no casa con la versión AAAA.MM.DD (ver CMakeLists.txt). Usa type=match."
            exit 1
          fi

          # 3) El tag que la action produce DE VERDAD con esa configuración.
          echo "Tags producidos: $TAGS"
          VERSION="$(printf '%s\n' "$TAGS" | sed -n 's#.*espaciokooplagunak-server:\(.*\)#\1#p' \
            | grep -v '^sha-' | head -1 || true)"
          if [ -z "$VERSION" ]; then
            echo "::error::La configuración de publicación no produce ningún tag de versión para v2026.08.27."
            exit 1
          fi
          # Y tiene que ser una versión del ESQUEMA de este repositorio, no un
          # `v*` cualquiera: aceptar `1.2.3` sería aceptar que el tag de versión
          # existe sin comprobar que es el que este repositorio genera.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'; then
            echo "::error::El tag de versión producido ('${VERSION}') no tiene el esquema AAAA.MM.DD del repositorio."
            exit 1
          fi
          case "$TAGS" in
            *:latest*) echo "::error::El job de publicación generaría latest."; exit 1 ;;
          esac

          # 4) Control negativo: con un grupo inexistente NO puede salir versión.
          #    Si sale, la comprobación (3) no está midiendo lo que dice medir.
          MALO="$(printf '%s\n' "${TAGS_GRUPO_MALO:-}" | sed -n 's#.*espaciokooplagunak-server:\(.*\)#\1#p' \
            | grep -v '^sha-' | head -1 || true)"
          if [ -n "$MALO" ]; then
            echo "::error::Con group=99 (inexistente) sale el tag '${MALO}': la guarda no distingue una configuración buena de una rota."
            exit 1
          fi

          echo "OK: v2026.08.27 -> ${VERSION}, y group=99 no produce versión."
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: bridge
          file: bridge/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bridge-publish-dry-run
          cache-to: type=gha,mode=max,scope=bridge-publish-dry-run

  publish:
    name: ${{ matrix.image.name }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - name: server
            dockerfile: docker/Dockerfile
            context: .
          - name: bridge
            dockerfile: bridge/Dockerfile
            context: bridge
    # Todas las actions fijadas a SHA completo: este job tiene un token con
    # `packages: write`, y un tag móvil (vN) permitiría a una action alterada
    # leerlo o publicar imágenes sustituidas.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/espaciokooplagunak-${{ matrix.image.name }}
          # Sin `latest`: versión del tag git (o `manual` en dispatch) + SHA corto.
          #
          # La versión de este repositorio es por FECHA (`AAAA.MM.DD`, calculada en
          # CMakeLists.txt), y eso NO es semver: `2026.08.27` lleva un cero a la
          # izquierda en el mes, que semver prohíbe. `type=semver` no avisa con un
          # error sino con un warning, así que el job salía VERDE publicando la
          # imagen sin ningún tag de versión — solo `sha-`. Pasó de verdad al cortar
          # v2026.08.27. Por eso se casa el tag por patrón y no por semver.
          flavor: |
            latest=false
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=manual,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
