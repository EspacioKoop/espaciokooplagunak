# Tests de las herramientas de Python (tools/): asistente de instalación,
# empaquetador del módulo de Foundry y auditor de cabeceras i18n. Job ligero
# y separado de los builds C++: solo Python y polib (el único import de
# terceros de estos tests; el resto de requirements-i18n son pesados y no
# hacen falta aquí). Límite declarado: cubre Linux — la ruta nativa de
# Windows del instalador no se ejercita en CI.
name: Tools

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/tools.yml"
      # La trazabilidad de nombres DP depende de estos dos ficheros tanto como
      # de la propia herramienta (#310).
      - "scripts/public_domain_names_scenario_utility.lua"
      - "docs/DOMINIO_PUBLICO_SCIFI.md"
  pull_request:
    paths:
      - "tools/**"
      - ".github/workflows/tools.yml"
      - "scripts/public_domain_names_scenario_utility.lua"
      - "docs/DOMINIO_PUBLICO_SCIFI.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tools/tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Instalar dependencias de test
        run: python3 -m pip install pytest polib==1.2.0
      - name: Ejecutar tests de tools/
        run: python3 -m pytest tools/tests/ -q
      - name: Trazabilidad de nombres de dominio público (#310)
        run: python3 tools/check_public_domain_names.py
