# Política local: cada etiqueta usa únicamente reglas `changed-files` con una
# lista explícita de matchers. No se admiten reglas de rama, grupos `any`/`all`
# ni opciones globales; esa restricción mantiene la configuración determinista.
"area:bridge":
  - changed-files:
      - any-glob-to-any-file:
          - "bridge/**"

"area:docker":
  - changed-files:
      - any-glob-to-any-file:
          - "docker/**"
          - "compose.yaml"
          - "compose.*.yaml"

"area:foundry":
  - changed-files:
      - any-glob-to-any-file:
          - "foundry-module/**"

"area:escenarios":
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/scenario_90_lagunak_primera_guardia.lua"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"

automation:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/dependabot.yml"
          - ".github/labeler.yml"

python:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.py'

javascript:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.js'
          - '**/*.mjs'
          - '**/*.ts'
          - '**/*.test.js'
          - '**/*.test.mjs'
          - '**/*.spec.ts'

cpp:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.cpp'
          - '**/*.h'
          - '**/*.hpp'

lua:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.lua'

"area:juego":
  - changed-files:
      - any-glob-to-any-file:
          - "src/**"

seguridad:
  - changed-files:
      - any-glob-to-any-file:
          - "SECURITY.md"
          - "src/httpScriptAccess.cpp"
          - "src/httpScriptAccess.h"
          - "docs/adr/0001-exec-lua-nunca-expuesto.md"
          - "docs/adr/0011-riesgos-de-seguridad-y-defensa-en-profundidad.md"

decision:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/adr/**"
