name: Foundry module

on:
  push:
    branches: [main]
  # Sin `paths:` a propósito (#361). Con el filtro en el disparador, un PR que no
  # toca el módulo no producía NINGÚN check run, y un check requerido que no
  # existe deja el PR esperando para siempre. El filtro vive ahora dentro, donde
  # saltar un job lo deja `skipped` —reportado— en vez de inexistente.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  changes:
    name: Filtro de rutas (módulo)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filtro.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - id: filtro
        uses: ./.github/actions/filtro-rutas
        with:
          # `scripts/` es deliberadamente prefijo: helpers y regresiones futuros
          # del inventario también deben despertar la puerta, no solo dos nombres.
          rutas: '^(foundry-module/|scripts/|docs/orphan-declarations\.json$|\.github/workflows/foundry-module\.yml$|\.github/actions/)'

  tests:
    name: Tests del módulo Foundry (Node)
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # La guarda de módulos nuevos compara con la base del PR, así que
          # hace falta el commit de la base: con el clon superficial de serie
          # `git diff base...HEAD` no tiene con qué comparar.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Instalar draco3d (tools/convertir-estatua.mjs, vía museo-escena.test.mjs)
        run: npm install draco3d@1.5.7 --no-save
      - name: Comprobar sintaxis JavaScript
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(foundry-module/scripts/**/*.mjs foundry-module/tests/**/*.mjs)
          ((${#files[@]} > 0))
          for file in "${files[@]}"; do
            node --check "$file"
          done
      - name: Ejecutar tests del módulo
        shell: bash
        run: |
          shopt -s globstar
          node --test foundry-module/tests/**/*.test.mjs
      - name: Probar el inventario conservador de módulos
        run: python3 -m unittest discover -s scripts/tests -p 'test_check_orphan_modules.py'
      - name: Verificar inventario conservador de módulos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_orphan_modules.py --check --check-github-evidence
      - name: Ningún módulo nuevo entra sin consumidor ni declaración
        # La guarda sobre el DELTA. `--check` mira el estado absoluto y tolera
        # los `unknown` heredados a propósito (#701: ante sintaxis que el lexer
        # no puede demostrar, mejor no saber que acusar en falso). Eso protege a
        # lo que ya está en el árbol; un módulo que ESTRENA el PR y sale
        # `unknown` no tiene esa excusa, y sin esto entra callando — que es
        # cómo la reposición de #537 estuvo cuatro semanas sin superficie y
        # cómo doce módulos del bloque de combate (#1012–#1035) iban a entrar
        # a la vez. Solo corre en pull_request: en un push a `main` no hay
        # base con la que comparar.
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          git diff --name-only --diff-filter=A "$base"...HEAD > /tmp/modulos-nuevos.txt
          python3 scripts/check_orphan_modules.py \
            --check --nuevos /tmp/modulos-nuevos.txt --proponer
      - name: El PNG prerenderizado corresponde al generador
        run: node tools/prerender-piel.mjs --check

  puerta:
    name: Puerta del módulo Foundry
    # `always()` para que la puerta exista incluso cuando todo lo que vigila se
    # ha saltado: ese es justo el caso que tiene que reportar verde.
    if: always()
    needs: [changes, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: ./.github/actions/puerta
        with:
          resultados: ${{ toJSON(needs) }}
