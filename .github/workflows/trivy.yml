name: Trivy — imágenes Docker

on:
  push:
    branches: [main]
  # El filtro se mudó del disparador a un job (#361). El escaneo sigue sin
  # correr en los PRs que no tocan las imágenes: lo que cambia es que ahora lo
  # dice —`skipped`— en vez de no existir.
  pull_request:
    branches: [main]
  schedule:
    - cron: "19 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Filtro de rutas (imágenes)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filtro.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - id: filtro
        uses: ./.github/actions/filtro-rutas
        with:
          rutas: '^(\.github/workflows/trivy\.yml$|\.github/actions/|docker/Dockerfile$|bridge/Dockerfile$|bridge/requirements\.txt$)'

  scan:
    needs: changes
    # Los tokens de PR de forks no pueden subir SARIF. No usamos
    # pull_request_target porque construiría código no confiable con permisos.
    if: >-
      needs.changes.outputs.run == 'true'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    name: ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: server
            dockerfile: docker/Dockerfile
            context: .
          - name: bridge
            dockerfile: bridge/Dockerfile
            context: bridge
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Construir imagen
        env:
          IMAGE: local/espaciokooplagunak-${{ matrix.image.name }}:${{ github.sha }}
        run: |
          docker build \
            --file "${{ matrix.image.dockerfile }}" \
            --tag "$IMAGE" \
            "${{ matrix.image.context }}"

      - name: Analizar vulnerabilidades HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: local/espaciokooplagunak-${{ matrix.image.name }}:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          format: sarif
          output: trivy-${{ matrix.image.name }}.sarif
          severity: HIGH,CRITICAL
          # El SARIF incluye TODAS las severidades salvo que se limite
          # explícitamente; esto retira el ruido LOW/MEDIUM/UNKNOWN (issue
          # #142) sin ocultar HIGH/CRITICAL sin parche, que siguen visibles
          # para su triaje (p. ej. retirar curl/dependencias de la imagen).
          limit-severities-for-sarif: true
          ignore-unfixed: false
          exit-code: "0"
          timeout: 10m0s

      - name: Subir resultados a Code Scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-${{ matrix.image.name }}.sarif
          category: trivy-${{ matrix.image.name }}
          wait-for-processing: true

  puerta:
    name: Puerta de imágenes
    if: always()
    needs: [changes, scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: ./.github/actions/puerta
        with:
          resultados: ${{ toJSON(needs) }}
