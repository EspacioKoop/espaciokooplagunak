---
name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Filtro de rutas
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      # Checkout shallow (depth 1): no clonamos la historia completa de
      # EmptyEpsilon solo para un diff. El diff de dos puntos base↔merge basta.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Decidir si compilar
        id: filter
        shell: bash
        run: |
          # Por defecto se compila. Solo se omite la build C++/Lua cuando TODO el
          # cambio del PR cae en rutas que no pueden afectarla; así, una ruta
          # nueva que sí influya sigue disparando la build (fallo seguro). Ante
          # cualquier problema resolviendo el diff, también se compila.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Evento ${{ github.event_name }}: se compila siempre."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.base_ref }}"
          if ! git fetch --no-tags --depth=1 origin "+refs/heads/$base:refs/remotes/origin/$base"; then
            echo "No se pudo traer la base → se compila por seguridad."
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "origin/$base" HEAD)" || {
            echo "diff falló → se compila por seguridad."
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "Archivos cambiados en el PR:"; echo "$changed"
          safe='^(foundry-module/|bridge/|docs/|tools/|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE|\.github/dependabot\.yml|.*\.md$|LICENSE$|\.gitignore$|\.editorconfig$)'
          if [ -z "$changed" ] || echo "$changed" | grep -qvE "$safe"; then
            echo "Cambios fuera de rutas seguras (o diff vacío) → se compila."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Solo rutas seguras (docs/módulo/puente/tools) → se omite la build C++/Lua."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Linux
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - name: Update apt index
      run: sudo apt-get update -qq
    - name: Install SDL2
      run: sudo apt-get install libsdl2-dev
    - name: Checkout EmptyEpsilon
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
    - name: Build and test
      run: docker/build.sh
  windows-cross:
    name: Windows (Cross-Compile)
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dependencies
        run: |
          sudo apt update -qq
          sudo apt install build-essential cmake python3-minimal mingw-w64 ninja-build p7zip-full
      - name: SeriousProton Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: daid/SeriousProton
          path: SeriousProton
          ref: master
      - name: EmptyEpsilon Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          path: EmptyEpsilon
      - name: Discord game SDK cache
        # El SDK se descarga de dl-game-sdk.discordapp.net en cada configure (#400).
        # Cachearlo quita la dependencia de red en la mayoría de ejecuciones: el
        # `if(NOT EXISTS ...)` de CMakeLists.txt se salta la descarga si ya está.
        #
        # La clave lleva la versión de `DISCORD_SDK_VERSION` (cmake/DiscordGameSdk.cmake):
        # subir de versión ahí sin tocarla aquí serviría el SDK viejo desde la
        # caché y la versión fijada no significaría nada. Van juntas a mano
        # porque el `cmake` que sabe la versión aún no ha corrido.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _build_win32/externals/discord
          key: discord-game-sdk-win32-3.2.1
      - name: Build
        run: |
          mkdir -p _build_win32
          cd _build_win32
          cmake ../EmptyEpsilon -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_TOOLCHAIN_FILE=../EmptyEpsilon/cmake/mingw.toolchain -DSERIOUS_PROTON_DIR=../SeriousProton -DWARNING_IS_ERROR=1
          ninja package
  macos:
    name: MacOS
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: macos-latest
    steps:
      - name: Dependencies
        run: |
          brew install sdl2
      - name: SeriousProton Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: daid/SeriousProton
          path: SeriousProton
          ref: master
      - name: EmptyEpsilon Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          path: EmptyEpsilon
      - name: Build
        run: |
          mkdir -p _build_macos
          cd _build_macos
          cmake ../EmptyEpsilon -G Ninja -DSERIOUS_PROTON_DIR=../SeriousProton -DCMAKE_INSTALL_PREFIX=. -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DCMAKE_PREFIX_PATH=$(brew --prefix sdl2) -DWARNING_IS_ERROR=1
          ninja
          ninja install
          APP_PATH="./EmptyEpsilon.app"
          mkdir -p "$APP_PATH/Contents/Frameworks"
          cp $(brew --prefix sdl2)/lib/libSDL2-2.0.0.dylib "$APP_PATH/Contents/Frameworks/"
          cp $(brew --prefix freetype)/lib/libfreetype.6.dylib "$APP_PATH/Contents/Frameworks/"
          cp $(brew --prefix libpng)/lib/libpng16.16.dylib "$APP_PATH/Contents/Frameworks/" || true
          install_name_tool -add_rpath @executable_path/../Frameworks "$APP_PATH/Contents/MacOS/EmptyEpsilon"
          install_name_tool -change $(brew --prefix sdl2)/lib/libSDL2-2.0.0.dylib @rpath/libSDL2-2.0.0.dylib "$APP_PATH/Contents/MacOS/EmptyEpsilon"
          install_name_tool -change $(brew --prefix freetype)/lib/libfreetype.6.dylib @rpath/libfreetype.6.dylib "$APP_PATH/Contents/MacOS/EmptyEpsilon"
          install_name_tool -change $(brew --prefix libpng)/lib/libpng16.16.dylib @rpath/libpng16.16.dylib "$APP_PATH/Contents/Frameworks/libfreetype.6.dylib" || true
          codesign --remove-signature "$APP_PATH/Contents/Frameworks/libSDL2-2.0.0.dylib"
          codesign --remove-signature "$APP_PATH/Contents/Frameworks/libfreetype.6.dylib"
          codesign --remove-signature "$APP_PATH/Contents/Frameworks/libpng16.16.dylib" || true
          codesign --remove-signature "$APP_PATH/Contents/MacOS/EmptyEpsilon"
          codesign --force --deep --timestamp --sign - "$APP_PATH"
          VERSION=$(date +%Y.%m.%d)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir dmg_contents
          cp -R "$APP_PATH" dmg_contents/
          ln -s /Applications dmg_contents/Applications
          i=0
          until hdiutil create -volname EmptyEpsilon -srcfolder dmg_contents -ov -format UDZO "MacOS_EmptyEpsilon_EE-${VERSION}-arm64.dmg"
          do
            if [ $i -eq 10 ]; then exit 1; fi
            i=$((i+1))
            sleep 1
          done
          rm -rf dmg_contents
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: EmptyEpsilon-EE-${{ env.VERSION }}-macOS-arm64
          path: _build_macos/MacOS_EmptyEpsilon_EE-*-arm64.dmg
          retention-days: 30
  windows:
    if: false
    name: Windows
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Debug, RelWithDebInfo, Release]
    steps:
      - name: Dependencies
        run: |
          $sdl_version = "2.0.16"
          $sdl_link = "https://libsdl.org/release/SDL2-devel-$sdl_version-VC.zip"
          $sdl_zip = "$env:GITHUB_WORKSPACE/sdl-dev.zip"
          (new-object System.Net.WebClient).DownloadFile($sdl_link, $sdl_zip)
          Expand-Archive -LiteralPath $sdl_zip -DestinationPath "$env:GITHUB_WORKSPACE/externals"
          $sdl_config = @"
          set(flavor x86)
          if(CMAKE_SIZEOF_VOID_P EQUAL 8)
              set(flavor x64)
          endif()
          set(_SDL2_prefix "`${CMAKE_CURRENT_LIST_DIR}/SDL2-$sdl_version")

          add_library(SDL2::SDL2main STATIC IMPORTED)
          set_target_properties(SDL2::SDL2main PROPERTIES
          IMPORTED_LOCATION "`${_SDL2_prefix}/lib/`${flavor}/SDL2main.lib"
          )

          add_library(SDL2::SDL2 SHARED IMPORTED)
          set_target_properties(SDL2::SDL2 PROPERTIES
          IMPORTED_LOCATION "`${_SDL2_prefix}/lib/`${flavor}/SDL2.dll"
          IMPORTED_IMPLIB "`${_SDL2_prefix}/lib/`${flavor}/SDL2.lib"
          INTERFACE_INCLUDE_DIRECTORIES "`${_SDL2_prefix}/include"
          )

          target_link_libraries(SDL2::SDL2 INTERFACE SDL2::SDL2main)
          "@
          Set-Content -Path "$env:GITHUB_WORKSPACE/externals/sdl2-config.cmake" -Value $sdl_config
          Get-Content "$env:GITHUB_WORKSPACE/externals/sdl2-config.cmake"
      - name: EmptyEpsilon Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          path: EmptyEpsilon
      - name: SeriousProton Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: daid/SeriousProton
          path: SeriousProton
          ref: master
      - name: Discord game SDK cache
        # Este job configura desde `build/`, así que PROJECT_BINARY_DIR y su
        # `externals/discord` viven bajo ese directorio. La clave es distinta de
        # cross-compile: aquel job parchea Windows.h para el filesystem de Linux
        # y no debe servir esa cabecera modificada al compilador nativo.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/externals/discord
          key: discord-game-sdk-windows-native-3.2.1
      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build
      - name: Configure CMake
        working-directory: ${{github.workspace}}/build
        run: >
          cmake ../EmptyEpsilon
          -G "Visual Studio 17 2022" -A Win32
          -DSDL2_DIR:PATH="$env:GITHUB_WORKSPACE/externals"
          -DSERIOUS_PROTON_DIR="../SeriousProton"
      - name: Build
        working-directory: ${{github.workspace}}/build
        run: cmake --build . --config ${{ matrix.build_type }} --target package 
  luatest:
    name: LuaTest
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - name: Update apt index
      run: sudo apt-get update -qq
    - name: Install dependencies
      run: sudo apt-get install lua5.3
    - name: Checkout EmptyEpsilon
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
    - name: Test if lua scripts parse
      run: find scripts/ -iname "*.lua" | xargs -P 4 -n 1 luac -p

  puerta:
    name: Puerta de build C++/Lua
    # Los jobs de esta área ya reportaban (se saltan por `if:`, no por `paths:`),
    # así que aquí la puerta no arregla nada roto: da un nombre estable que exigir
    # y que no cambia si mañana se parte `linux` en dos o se renombra `luatest`.
    if: always()
    needs: [changes, linux, windows-cross, macos, windows, luatest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: ./.github/actions/puerta
        with:
          resultados: ${{ toJSON(needs) }}
