# SonarCloud — configuración del fork.
#
# La regla que gobierna este fichero: SONAR MIDE LO QUE ES NUESTRO. Este árbol
# es un fork de EmptyEpsilon, así que la mayor parte del C++ y de los escenarios
# Lua son código heredado que no vamos a tocar (ADR-0007 fija esa frontera). Sin
# exclusiones, el informe se llena de miles de issues sobre código de upstream y
# la señal propia se pierde dentro — un informe que nadie mira no mide nada.

sonar.organization=espaciokoop
sonar.projectKey=EspacioKoop_espaciokooplagunak
sonar.projectName=Espaciokoop Lagunak

sonar.sources=.
sonar.sourceEncoding=UTF-8

# Lo propio del fork, que es lo que sí queremos medido:
#   bridge/            el puente (Python)
#   foundry-module/    el módulo de Foundry (JS)
#   tools/             el instalador y las utilidades (Python, JS)
#   scripts/scenario_90_lagunak_primera_guardia.lua y las utilidades propias
#   src/ solo en lo que hemos divergido — hoy no hay forma de expresarlo por
#        ruta, así que se excluye entero y se revisa a mano (ver más abajo).
sonar.exclusions=\
  resources/**,\
  packs/**,\
  build/**,\
  src/**,\
  SeriousProton/**,\
  script_docs/vendor/**,\
  scripts/locale/**,\
  scripts/scenario_[0-8]*.lua,\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/*.min.js,\
  bridge/tests/**,\
  foundry-module/tests/**,\
  tools/tests/**,\
  scripts/tests/**

# Los tests se declaran como tests y no como fuente: si no, Sonar cuenta la
# duplicación entre casos de prueba como deuda, y en una suite de 2.400 casos
# eso ahoga cualquier otra señal. Repetirse en un test suele ser una virtud.
# sonar.sources y sonar.tests deben ser conjuntos DISJUNTOS (si no, el primer
# análisis con token falla por indexación doble): estos mismos directorios se
# excluyen arriba de sonar.sources para que solo cuenten como tests.
sonar.tests=\
  bridge/tests,\
  foundry-module/tests,\
  tools/tests,\
  scripts/tests

sonar.python.version=3.11
sonar.javascript.node.maxspace=4096

# `src/**` queda fuera a propósito y no por comodidad: son ~200.000 líneas de
# upstream con una divergencia propia pequeña y localizada. Medirlas daría una
# deuda que no es nuestra y que no podemos pagar sin romper el merge con
# upstream. Si algún día se quiere medir la divergencia, el sitio es una lista
# explícita de los ficheros que este fork ha tocado de verdad, no `src/**`.
